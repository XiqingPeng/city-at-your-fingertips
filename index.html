<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A City at Your Fingertips</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script></head>
<body><main id="scene"></main><div class="overlay"><header><span class="eyebrow">INTERACTIVE LANDSCAPE · PROTOTYPE 01</span><h1>A City at<br><em>Your Fingertips</em></h1><p>用双手，慢慢塑造一座城市。</p></header><section class="panel"><div class="heading"><span>手势控制</span><span id="status">手动模式</span></div><button id="camera">开启摄像头</button><p class="hint">双手靠近 → 城市更密集<br>双手抬高 → 建筑生长<br>左右挥手 → 城市变成森林</p><div class="preview"><video id="video" autoplay playsinline muted></video><canvas id="hands"></canvas><span id="preview-label">摄像头尚未开启</span></div><div class="sliders"><label>建筑高度 <output id="height-value"></output><input id="height" type="range" min="0" max="100" value="45"></label><label>城市密度 <output id="density-value"></output><input id="density" type="range" min="0" max="100" value="65"></label><label>森林比例 <output id="forest-value"></output><input id="forest" type="range" min="0" max="100" value="15"></label></div><p class="foot">拖动滑块也可以探索 · 鼠标拖动旋转视角</p></section></div><script type="module" src="app.js"></script></body></html>
